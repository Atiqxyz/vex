name: VEX Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-26-intel
            platform: macos-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python for cross-platform archives
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          extra_args=()
          if [[ "$RELEASE_PLATFORM" == "macos-x86_64" ]]; then
            extra_args+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0")
          fi
          if [[ "$RELEASE_PLATFORM" == "windows-x86_64" ]]; then
            extra_args+=("-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVEX_EMBED_DEFAULT_C_COMPILER=OFF "${extra_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install into release staging directory
        run: cmake --install build --prefix package --config Release

      - name: Create CLI archive
        run: python -c "import shutil; shutil.make_archive('vex-cli-${{ matrix.platform }}', 'zip', root_dir='package')"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: vex-cli-${{ matrix.platform }}
          path: vex-cli-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

  package-vscode:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        working-directory: editors/vscode
        shell: bash
        run: |
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies --out "vex-language-${GITHUB_REF_NAME}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vex-vscode-extension
          path: editors/vscode/vex-language-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs: [build-cli, package-vscode]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vex-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "VEX $GITHUB_REF_NAME" --generate-notes
