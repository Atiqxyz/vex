name: VEX Distribution

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    needs: package-vscode
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            zig_archive: zig-x86_64-windows-0.17.1.zip
            zig_sha256: b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e
          - os: ubuntu-latest
            platform: linux-x64
            zig_archive: zig-x86_64-linux-0.17.1.tar.xz
            zig_sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          - os: macos-26-intel
            platform: macos-x64
            zig_archive: zig-x86_64-macos-0.17.1.tar.xz
            zig_sha256: 9af07b20319fbd0c92ee46ad23e81d6a782b1aaea2cfb8dcbff35f1d2c7ddbb7
          - os: macos-26
            platform: macos-arm64
            zig_archive: zig-aarch64-macos-0.17.1.tar.xz
            zig_sha256: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell installer syntax validation failed"
          }

      - name: Download and verify Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:ZIG_ARCHIVE
          $unpack = Join-Path $env:RUNNER_TEMP "zig-unpack"
          $stage = Join-Path $env:GITHUB_WORKSPACE "zig-staging"
          $url = "https://ziglang.org/download/0.17.1/$($env:ZIG_ARCHIVE)"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ZIG_SHA256) {
            throw "Zig archive SHA-256 mismatch. Expected $env:ZIG_SHA256, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $unpack -Force
          $zigExe = Get-ChildItem -Path $unpack -Filter "zig.exe" -File -Recurse | Select-Object -First 1
          if (-not $zigExe) { throw "The verified Zig archive did not contain zig.exe" }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $zigExe.Directory.FullName "*") -Destination $stage -Recurse -Force
          if (-not (Test-Path (Join-Path $stage "lib"))) { throw "The Zig lib directory was not staged" }

      - name: Download and verify Zig (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ZIG_ARCHIVE"
          url="https://ziglang.org/download/0.17.1/$ZIG_ARCHIVE"
          curl --fail --location --retry 3 "$url" --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p zig-staging
          tar -xf "$archive" --strip-components=1 -C zig-staging
          test -x zig-staging/zig
          test -d zig-staging/lib

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVEX_ZIG_TOOLCHAIN_DIR="${{ github.workspace }}/zig-staging"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install distribution files
        run: cmake --install build --config Release --prefix dist/vex

      - name: Include the VS Code extension in the installation
        uses: actions/download-artifact@v4
        with:
          name: vex-vscode-extension
          path: dist/vex/share/vex

      - name: Verify installed package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:GITHUB_WORKSPACE "dist/vex/bin/vex.exe"
          $source = Join-Path $env:GITHUB_WORKSPACE "examples/hello.vex"
          $work = Join-Path $env:GITHUB_WORKSPACE "dist/smoke-test"
          cmake "-DVEX_EXECUTABLE=$compiler" "-DSOURCE_FILE=$source" "-DWORK_DIR=$work" -P tests/portable_install_smoke.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake "-DVEX_EXECUTABLE=$GITHUB_WORKSPACE/dist/vex/bin/vex" \
                "-DSOURCE_FILE=$GITHUB_WORKSPACE/examples/hello.vex" \
                "-DWORK_DIR=$GITHUB_WORKSPACE/dist/smoke-test" \
                -P tests/portable_install_smoke.cmake

      - name: Archive CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location dist
          cmake -E tar cf vex-${{ matrix.platform }}.zip --format=zip vex
          Pop-Location

      - name: Archive CLI (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar -czf vex-${{ matrix.platform }}.tar.gz vex

      - name: Test Windows installer end-to-end
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $archive = Join-Path $releaseDir "vex-windows-x64.zip"
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  vex-windows-x64.zip" | Out-File -FilePath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

          $python = (Get-Command python -ErrorAction Stop).Source
          $server = Start-Process -FilePath $python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $releaseDir) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:8765/SHA256SUMS.txt" -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "Local release mirror did not start" }

            $env:VEX_RELEASE_BASE_URL = "http://127.0.0.1:8765"
            $env:VEX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "vex-installer-test"
            $env:VEX_SKIP_VSCODE = "1"
            & "$env:GITHUB_WORKSPACE/scripts/install.ps1"
            if ($LASTEXITCODE -ne 0) { throw "VEX installer script failed" }

            $compiler = Join-Path $env:VEX_INSTALL_DIR "bin/vex.exe"
            cmake "-DVEX_EXECUTABLE=$compiler" "-DSOURCE_FILE=$env:GITHUB_WORKSPACE/examples/hello.vex" "-DWORK_DIR=$env:RUNNER_TEMP/vex-installer-smoke" -P "$env:GITHUB_WORKSPACE/tests/portable_install_smoke.cmake"
            if ($LASTEXITCODE -ne 0) { throw "Installed VEX smoke test failed" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Test Linux and macOS installer end-to-end
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive="vex-${{ matrix.platform }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > SHA256SUMS.txt
          else
            shasum -a 256 "$archive" > SHA256SUMS.txt
          fi

          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$PWD" > "$RUNNER_TEMP/vex-release-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/SHA256SUMS.txt >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8765/SHA256SUMS.txt >/dev/null

          export HOME="$RUNNER_TEMP/vex-installer-home"
          mkdir -p "$HOME"
          export VEX_RELEASE_BASE_URL="http://127.0.0.1:8765"
          export VEX_INSTALL_DIR="$RUNNER_TEMP/vex-installer-test"
          export VEX_SKIP_VSCODE=1
          bash "$GITHUB_WORKSPACE/scripts/install.sh"

          compiler="$VEX_INSTALL_DIR/bin/vex"
          cmake "-DVEX_EXECUTABLE=$compiler" \
                "-DSOURCE_FILE=$GITHUB_WORKSPACE/examples/hello.vex" \
                "-DWORK_DIR=$RUNNER_TEMP/vex-installer-smoke" \
                -P "$GITHUB_WORKSPACE/tests/portable_install_smoke.cmake"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: vex-${{ matrix.platform }}
          path: dist/vex-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 14

  package-vscode:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate extension and Unix installer
        run: |
          node --check editors/vscode/extension.js
          node editors/vscode/validate.mjs
          bash -n scripts/install.sh

      - name: Package VSIX
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --no-dependencies --out vex-language-0.1.0.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vex-vscode-extension
          path: editors/vscode/vex-language-0.1.0.vsix
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, package-vscode]
    runs-on: ubuntu-latest
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vex-*
          path: dist
          merge-multiple: true

      - name: Stage installer scripts
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum install.sh install.ps1 vex-* > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
