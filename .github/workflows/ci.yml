name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Diagnose Linux test failure
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex 'info line *$pc' -ex 'frame 0' -ex 'info args' -ex 'info locals' -ex bt --args build/vex_tests

      - name: Validate VS Code extension
        run: |
          node --check editors/vscode/extension.js
          node editors/vscode/validate.mjs
